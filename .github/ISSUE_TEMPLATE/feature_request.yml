name: Feature request
description: Suggest a bounded, profile-safe improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Newton Operations keeps Hermes authoritative. Requests that introduce another scheduler, memory system, task authority, or unauthenticated service are outside the project scope.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational friction should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and its privacy/profile boundary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
